# Open Aura — one-command local stack: Postgres + the app (MCP server + viewer).
#   1. cp .env.example .env   and set a provider API key
#   2. docker compose up
#   3. backend (MCP) -> http://localhost:8090/mcp   (point your agent here; no auth)
#      viewer  (UI)  -> http://localhost:3000
# Service names match the container names (aura-db / aura-app), so targeting one
# service works as you'd expect: `docker compose up aura-app`.
services:
  aura-db:
    image: postgres:16-alpine
    container_name: aura-db
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    volumes:
      - aura_pgdata:/var/lib/postgresql/data
      # schema.sql runs once, on first init of an empty data volume.
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single app container: the MCP server (8090) + the read-only Streamlit viewer
  # (3000), run side by side via honcho (see Procfile).
  aura-app:
    build: .
    container_name: aura-app
    depends_on:
      aura-db:
        condition: service_healthy
    environment:
      APP_ENV: local
      AURA_LOCAL_MODE: "true"
      POSTGRES_URL: postgresql://aura:aura@aura-db:5432/aura
      AURA_MCP_PORT: "8090"
      AURA_SCORING_MODEL: ${AURA_SCORING_MODEL:-openai/gpt-oss-120b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8090:8090"   # MCP backend (agents connect here)
      - "3000:3000"   # Streamlit viewer

volumes:
  aura_pgdata:
