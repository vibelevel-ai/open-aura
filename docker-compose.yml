# Open Aura — one-command local stack: Postgres + backend (MCP + REST) + viewer.
#   1. cp .env.example .env   and set a provider API key
#   2. docker compose up
#   3. backend (MCP) -> http://localhost:8090/mcp   (point your agent here; no auth)
#      viewer  (UI)  -> http://localhost:3000
services:
  aura-db:
    image: postgres:16-alpine
    container_name: aura-db
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    volumes:
      - aura_pgdata:/var/lib/postgresql/data
      # schema.sql runs once, on first init of an empty data volume.
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Python backend: one FastAPI app serving the MCP transport (/mcp) and the
  # REST API (/api/aura). Agents connect here; the viewer proxies to it.
  aura-app:
    build: .
    container_name: aura-app
    depends_on:
      aura-db:
        condition: service_healthy
    environment:
      APP_ENV: local
      AURA_LOCAL_MODE: "true"
      POSTGRES_URL: postgresql://aura:aura@aura-db:5432/aura
      AURA_MCP_PORT: "8090"
      AURA_SCORING_MODEL: ${AURA_SCORING_MODEL:-openai/gpt-oss-120b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8090:8090"   # MCP backend + REST API (agents connect here)

  # Next.js viewer: renders the shared @vibelevel/aura-ui package against the
  # backend. Browser fetches /api/aura/* are proxied to aura-app internally.
  aura-ui:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: aura-ui
    depends_on:
      - aura-app
    environment:
      INTERNAL_API_URL: http://aura-app:8090
      AURA_PUBLIC_WEB_URL: ${AURA_PUBLIC_WEB_URL:-https://vibelevel.ai}
    ports:
      - "3000:3000"   # the viewer

volumes:
  aura_pgdata:
